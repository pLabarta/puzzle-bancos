<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Puzzle de bancos (debug)</title>
  <style>
    html { background: #16181c; }
    body { margin: 0; min-height: 100vh; background: #16181c; color: #e3e1dc; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script src="elm.js"></script>
  <script>
    var flags = { debug: true };
    try {
      var storedFontSize = parseInt(localStorage.getItem("drawerFontSize"), 10);
      if (!isNaN(storedFontSize)) {
        flags.drawerFontSize = storedFontSize;
      }
    } catch (e) {
      // localStorage unavailable (private mode, etc.) - Elm falls back to the default.
    }

    var app = Elm.Main.init({ node: document.getElementById("app"), flags: flags });

    if (app.ports && app.ports.saveDrawerFontSize) {
      app.ports.saveDrawerFontSize.subscribe(function (size) {
        try {
          localStorage.setItem("drawerFontSize", size);
        } catch (e) {
          // ignore - nothing to persist to
        }
      });
    }
  </script>
</body>
</html>
